# Builds the Google Play bundle (FERRET_STORE=play: no self-updater, no
# REQUEST_INSTALL_PACKAGES) and uploads it to a Play track. Manual only.
#
# Secrets:
#   ANDROID_UPLOAD_KEYSTORE_BASE64  base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD       the keystore's password
#   ANDROID_KEY_ALIAS               the key's alias in it
#   ANDROID_KEY_PASSWORD            the key's password (often the same)
#   PLAY_SERVICE_ACCOUNT_JSON       a Google Cloud service account key, invited
#                                   in Play Console with release permissions
#
# Play only takes API uploads once the app exists and its first bundle was
# uploaded by hand in Play Console.
name: Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: Play track
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: Release status (draft waits for you in Play Console)
        type: choice
        options: [draft, completed]
        default: draft
      build_number:
        description: versionCode, if not the one in apps/ferret/pubspec.yaml (Play refuses one it has seen)
        required: false

permissions:
  contents: read

concurrency:
  group: play
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Without a key, Gradle would quietly sign with the debug key.
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!name}" ] || { echo "::error::Secret for $name is missing"; exit 1; }
          done
          keystore="$RUNNER_TEMP/upload.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            echo "storeFile=$keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > apps/ferret/android/key.properties

      - name: Build the Play bundle
        working-directory: apps/ferret
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          flutter pub get
          args=(--release --dart-define=FERRET_STORE=play)
          [ -n "$BUILD_NUMBER" ] && args+=(--build-number="$BUILD_NUMBER")
          flutter build appbundle "${args[@]}"

      - name: Check the signature
        run: |
          bundle=apps/ferret/build/app/outputs/bundle/release/app-release.aab
          jarsigner -verify -certs "$bundle" | grep -q "jar verified" \
            || { echo "::error::The bundle isn't signed"; exit 1; }
          if jarsigner -verify -verbose -certs "$bundle" | grep -q "CN=Android Debug"; then
            echo "::error::The bundle is signed with the debug key"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ferret-play-aab
          path: apps/ferret/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.sofluffy.ferret
          releaseFiles: apps/ferret/build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}

      - name: Forget the key
        if: always()
        run: rm -f apps/ferret/android/key.properties "$RUNNER_TEMP/upload.jks"
