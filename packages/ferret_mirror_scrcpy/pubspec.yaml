name: ferret_mirror_scrcpy
description: A mirroring route that shows an Android screen over adb, by running scrcpy's official server on the device.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  # Unpacks Google's platform-tools zip. Pure Dart, so no unzip tool is needed.
  archive: ^4.0.7
  core:
    path: ../core
  crypto: ^3.0.6
  ferret_mirroring:
    path: ../ferret_mirroring
  flutter:
    sdk: flutter
  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0

flutter:
  assets:
    # scrcpy's released server, unmodified (Apache-2.0), with its licence.
    - assets/scrcpy-server-v5.0.1
    - assets/scrcpy-LICENSE.txt
    - assets/scrcpy-NOTICE.txt
