name: ferret_mirroring
description: Platform code for Ferret's screen mirroring feature, reusable on its own.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  # Calls Windows' waveOut from Dart, so sound needs no native build there.
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  sofluffy_texture:
    path: ../sofluffy_texture

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  pigeon: ^29.0.1

flutter:
  plugin:
    platforms:
      android:
        package: io.sofluffy.ferret_mirroring
        pluginClass: FerretMirroringPlugin
      macos:
        pluginClass: FerretMirroringPlugin
