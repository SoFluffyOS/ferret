name: ferret_iphone
description: Talks to an iPhone's standard Bluetooth LE services (ANCS notifications, AMS media) from a desktop. Platform code for Ferret's iPhone feature, reusable on its own.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  dbus: ^0.8.0
  flutter:
    sdk: flutter

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  pigeon: ^29.0.1

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: FerretIphonePlugin
      windows:
        pluginClass: FerretIphonePluginCApi
