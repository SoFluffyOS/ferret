name: ferret_battery
description: Reads this device's battery level and whether it charges, on Android, iOS, macOS, Windows and Linux. Platform code for Ferret's device rows, reusable on its own.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  ffi: ^2.2.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.sofluffy.ferret_battery
        pluginClass: FerretBatteryPlugin
      ios:
        pluginClass: FerretBatteryPlugin
