name: interop_quickshare
description: Speaks Google's Quick Share (Nearby Share) protocol over the local network, so Android phones can send to Ferret without installing anything.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.14.0

dependencies:
  core:
    path: ../core
  crypto: ^3.0.6
  fixnum: ^1.1.1
  # The mDNS responder that announces the Quick Share service.
  lan_discovery:
    path: ../lan_discovery
  # P-256 key agreement and AES-CBC for the UKEY2 handshake and the
  # encrypted frames. Pure Dart, maintained by the Bouncy Castle project.
  pointycastle: ^4.0.0
  protobuf: ^6.1.0

dev_dependencies:
  lints: ^6.0.0
  path: ^1.9.1
  test: ^1.32.0
