name: ferret_mirror_airplay
description: An AirPlay screen mirroring receiver, so an iPhone or iPad can show its screen on a computer with nothing installed on it.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  code_assets: ^2.2.0
  core:
    path: ../core
  crypto: ^3.0.6
  # Ed25519 and X25519 for pair-verify, the same package the transport uses.
  cryptography: ^2.9.0
  ferret_mirroring:
    path: ../ferret_mirroring
  flutter:
    sdk: flutter
  hooks: ^2.2.0
  # Its mDNS responder announces the AirPlay services.
  lan_discovery:
    path: ../lan_discovery
  # Compiles the vendored FairPlay C code in the build hook.
  native_toolchain_c: ^0.19.6
  # AES-CTR as a running stream, which the video channel needs.
  pointycastle: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
