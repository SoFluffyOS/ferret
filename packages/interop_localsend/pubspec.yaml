name: interop_localsend
description: Speaks the open LocalSend protocol, so Ferret can send to and receive from LocalSend apps on any platform.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.14.0

dependencies:
  core:
    path: ../core
  crypto: ^3.0.6
  # RSA key generation and signing for the self-signed TLS certificate.
  # Pure Dart, maintained by the Bouncy Castle project.
  pointycastle: ^4.0.0

dev_dependencies:
  lints: ^6.0.0
  path: ^1.9.1
  test: ^1.32.0
