name: ferret_remote_input
description: Injects pointer and keyboard input on macOS, Windows and Linux for a remote controller. Platform code for Ferret's remote input feature, reusable on its own.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  ffi: ^2.2.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  pigeon: ^29.0.1

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: FerretRemoteInputPlugin
      windows:
        pluginClass: FerretRemoteInputPluginCApi
