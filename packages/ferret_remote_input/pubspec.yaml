name: ferret_remote_input
description: Platform code for Ferret's remote input feature, reusable on its own.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  pigeon: ^29.0.1

flutter:
  plugin:
    platforms:
      android:
        package: io.sofluffy.ferret_remote_input
        pluginClass: FerretRemoteInputPlugin
      ios:
        pluginClass: FerretRemoteInputPlugin
      linux:
        pluginClass: FerretRemoteInputPlugin
      macos:
        pluginClass: FerretRemoteInputPlugin
      windows:
        pluginClass: FerretRemoteInputPluginCApi
