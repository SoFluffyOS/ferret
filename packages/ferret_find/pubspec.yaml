name: ferret_find
description: Rings a device so someone can find it, with volume raise and restore. Platform code for Ferret's find my device feature, reusable on its own.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  pigeon: ^29.0.1

flutter:
  assets:
    - assets/ring.wav
  plugin:
    platforms:
      android:
        package: io.sofluffy.ferret_find
        pluginClass: FerretFindPlugin
      ios:
        pluginClass: FerretFindPlugin
      macos:
        pluginClass: FerretFindPlugin
