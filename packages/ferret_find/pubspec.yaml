name: ferret_find
description: Platform code for Ferret's find my device feature, reusable on its own.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  pigeon: ^29.0.1

flutter:
  plugin:
    platforms:
      android:
        package: io.sofluffy.ferret_find
        pluginClass: FerretFindPlugin
      ios:
        pluginClass: FerretFindPlugin
      linux:
        pluginClass: FerretFindPlugin
      macos:
        pluginClass: FerretFindPlugin
      windows:
        pluginClass: FerretFindPluginCApi
