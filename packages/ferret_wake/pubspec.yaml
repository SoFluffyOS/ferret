name: ferret_wake
description: Wake-on-LAN in pure Dart. Builds and sends magic packets, reads this computer's network cards (MAC, broadcast address, Wake-on-LAN setting) on macOS, Linux and Windows, and Ferret's wake feature that shares them with paired devices and wakes one for another.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.14.0

dependencies:
  core:
    path: ../core
  engine:
    path: ../engine
  protobuf: ^6.1.0
  protocol:
    path: ../protocol

dev_dependencies:
  fake_async: ^1.3.3
  fixnum: ^1.1.1
  lints: ^6.0.0
  test: ^1.32.0
