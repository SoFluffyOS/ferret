name: ferret_docs
description: Ferret's docs site. Renders docs/public in place with Jaspr.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  jaspr: ^0.23.5
  jaspr_content: ^0.5.4
  jaspr_router: ^0.9.0
  path: ^1.9.1

dev_dependencies:
  build_runner: ^2.10.0
  build_web_compilers: ^4.8.0
  jaspr_builder: ^0.23.5
  jaspr_cli: ^0.23.5
  lints: ^6.0.0

jaspr:
  mode: static
