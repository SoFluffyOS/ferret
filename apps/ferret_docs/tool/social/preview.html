<!doctype html>
<!-- The landing page's link preview. scripts/social_previews.sh renders it
     with headless Chrome at 1200x630 (og:image) and 1280x640 (GitHub). -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: Nunito;
    src: url("../../web/fonts/nunito-latin.woff2") format("woff2");
    font-weight: 200 1000;
  }
  :root { --sable: #2b2320; --cream: #f5ebdc; --amber: #e39a33; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; }
  body {
    background:
      radial-gradient(60vw 60vw at 18% 38%, rgb(227 154 51 / 0.22), transparent 60%),
      var(--sable);
    color: var(--cream);
    font-family: Nunito, sans-serif;
    position: relative;
  }
  .copy { position: absolute; left: 6vw; top: 50%; transform: translateY(-50%); width: 44vw; }
  .icon { width: 10vw; height: 10vw; border-radius: 2.25vw; display: block; margin-bottom: 4.2vh; }
  h1 { font-size: 7.6vw; font-weight: 800; letter-spacing: -0.02em; line-height: 1; margin-bottom: 3.6vh; }
  .pitch { font-size: 2.75vw; font-weight: 600; line-height: 1.3; color: rgb(245 235 220 / 0.82); margin-bottom: 4.5vh; }
  .platforms { font-size: 1.75vw; font-weight: 800; color: var(--amber); margin-bottom: 1.2vh; }
  .facts { font-size: 1.55vw; font-weight: 700; color: rgb(245 235 220 / 0.6); }
  .shot {
    position: absolute; left: 50vw; top: 13vh; width: 66vw;
    border-radius: 1.2vw; box-shadow: 0 2vw 6vw rgb(0 0 0 / 0.45);
  }
</style>
</head>
<body>
  <div class="copy">
    <img class="icon" src="../../web/images/apple-touch-icon.png" alt="">
    <h1>Ferret</h1>
    <p class="pitch">Your phone and your computers, working as one.</p>
    <p class="platforms">Android · Mac · Windows · Linux</p>
    <p class="facts">No account · No cloud · Open source</p>
  </div>
  <img class="shot" src="../../../../docs/assets/landing/window-overview-dark.webp" alt="">
</body>
</html>
