name: shell
description: Ferret's app shell. Onboarding, devices, pairing and settings, hosting each feature's UI.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  app_links: ^6.4.0
  core:
    path: ../../packages/core
  desktop_drop: ^0.8.0
  device_info_plus: ^13.3.0
  engine:
    path: ../../packages/engine
  feature_kit:
    path: ../../packages/feature_kit
  ferret_battery:
    path: ../../packages/ferret_battery
  ferret_bonjour:
    path: ../../packages/ferret_bonjour
  ferret_menubar:
    path: ../../packages/ferret_menubar
  ferret_system:
    path: ../../packages/ferret_system
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.2
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_zxing: ^3.1.1
  intl: ^0.20.3
  lucide_icons_flutter: ^4.0.3
  protocol:
    path: ../../packages/protocol
  provider: ^6.1.5+1
  qr_flutter: ^4.1.0
  sofluffy_ui:
    path: ../../packages/sofluffy_ui
  transport:
    path: ../../packages/transport
  url_launcher: ^6.3.2

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  lints: ^6.0.0

flutter:
  generate: true
  assets:
    - assets/notice_icon.png
