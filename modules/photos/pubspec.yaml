name: photos
description: Ferret's photos feature. Browse your phone's recent photos and screenshots on the computer, save them, and get new screenshots by themselves.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  core:
    path: ../../packages/core
  crypto: ^3.0.6
  engine:
    path: ../../packages/engine
  feature_kit:
    path: ../../packages/feature_kit
  ferret_photos:
    path: ../../packages/ferret_photos
  fixnum: ^1.1.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  lucide_icons_flutter: ^4.0.3
  path: ^1.9.1
  protobuf: ^6.1.0
  protocol:
    path: ../../packages/protocol
  provider: ^6.1.5+1
  sofluffy_ui:
    path: ../../packages/sofluffy_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  transport:
    path: ../../packages/transport

flutter:
  generate: true
