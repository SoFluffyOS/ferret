syntax = "proto3";

package ferret.remote_input.v1;

// Remote input lets one device (the controller, such as a phone) move the
// pointer and type on another (the computer). The computer asks its owner
// the first time each device wants control, shows that it is being
// controlled, and can stop it at any time.
//
// Versioning: `ControlRequest.version` and `ControlGrant.version` carry the
// version of these messages each side speaks, currently 1. A computer serves
// any controller whose version is not newer than its own major version and
// answers with its own. Fields and `InputEvent` kinds added later in the same
// major version are optional: a receiver ignores what it doesn't know.

// Asks the computer for control. Expects a `ControlPending`, `ControlGrant`
// or `ControlDeny` reply. After `ControlPending`, the computer sends the
// `ControlGrant` or `ControlDeny` later, without expecting a reply.
message ControlRequest {
  // The version of these messages the controller speaks.
  uint32 version = 1;
}

// The computer is asking its owner. The answer follows as `ControlGrant` or
// `ControlDeny`.
message ControlPending {
  // How long the computer waits for its owner before it denies with
  // `DENY_REASON_TIMEOUT`.
  uint32 timeout_seconds = 1;
}

// The controller may send `InputBatch`es until either side sends
// `ControlStop`.
message ControlGrant {
  // The version of these messages the computer speaks.
  uint32 version = 1;
  // The computer's owner allowed this device for good, not just this once.
  bool always = 2;
}

// Why a computer said no.
enum DenyReason {
  DENY_REASON_UNSPECIFIED = 0;
  // Its owner said no.
  DENY_REASON_DENIED = 1;
  // Nobody answered on the computer in time.
  DENY_REASON_TIMEOUT = 2;
  // Another device controls it, or asks to, right now.
  DENY_REASON_BUSY = 3;
  // The system permission to control input is missing, such as
  // Accessibility on macOS. The computer shows its owner how to allow it.
  DENY_REASON_NEEDS_PERMISSION = 4;
  // This computer has no way to inject input, such as Linux without uinput
  // access, xdotool or ydotool.
  DENY_REASON_UNSUPPORTED = 5;
  // Its owner turned remote input off.
  DENY_REASON_TURNED_OFF = 6;
  // The controller speaks a newer major version.
  DENY_REASON_VERSION = 7;
}

message ControlDeny {
  DenyReason reason = 1;
}

// Why control ended.
enum StopReason {
  STOP_REASON_UNSPECIFIED = 0;
  // The controller is done, such as when its touchpad page closed.
  STOP_REASON_CONTROLLER_DONE = 1;
  // Someone on the computer pressed Stop.
  STOP_REASON_STOPPED_ON_HOST = 2;
  // Nothing happened for a long time.
  STOP_REASON_IDLE = 3;
  // The computer's owner revoked this device, or turned remote input off.
  STOP_REASON_REVOKED = 4;
  // Input arrived from a device that has no control right now.
  STOP_REASON_NOT_CONTROLLING = 5;
  // The computer can no longer inject input, such as when its owner turned
  // Accessibility access off.
  STOP_REASON_FAILED = 6;
}

// Ends control. Either side sends it, without expecting a reply. The
// computer releases every button and key still held.
message ControlStop {
  StopReason reason = 1;
}

// A pointer button.
enum MouseButton {
  MOUSE_BUTTON_UNSPECIFIED = 0;
  MOUSE_BUTTON_LEFT = 1;
  MOUSE_BUTTON_RIGHT = 2;
  MOUSE_BUTTON_MIDDLE = 3;
}

// A key, by what it is rather than by any platform's code. Text goes as
// `TextInput`; keys are for shortcuts and keys that type nothing.
enum Key {
  KEY_UNSPECIFIED = 0;
  KEY_ENTER = 1;
  KEY_BACKSPACE = 2;
  KEY_DELETE = 3;
  KEY_TAB = 4;
  KEY_ESCAPE = 5;
  KEY_SPACE = 6;
  KEY_ARROW_LEFT = 7;
  KEY_ARROW_RIGHT = 8;
  KEY_ARROW_UP = 9;
  KEY_ARROW_DOWN = 10;
  KEY_HOME = 11;
  KEY_END = 12;
  KEY_PAGE_UP = 13;
  KEY_PAGE_DOWN = 14;
  KEY_MEDIA_PLAY_PAUSE = 20;
  KEY_MEDIA_NEXT = 21;
  KEY_MEDIA_PREVIOUS = 22;
  KEY_VOLUME_UP = 23;
  KEY_VOLUME_DOWN = 24;
  KEY_VOLUME_MUTE = 25;
  KEY_F1 = 31;
  KEY_F2 = 32;
  KEY_F3 = 33;
  KEY_F4 = 34;
  KEY_F5 = 35;
  KEY_F6 = 36;
  KEY_F7 = 37;
  KEY_F8 = 38;
  KEY_F9 = 39;
  KEY_F10 = 40;
  KEY_F11 = 41;
  KEY_F12 = 42;
  // Letters and digits, for shortcuts such as Ctrl+C.
  KEY_A = 65;
  KEY_B = 66;
  KEY_C = 67;
  KEY_D = 68;
  KEY_E = 69;
  KEY_F = 70;
  KEY_G = 71;
  KEY_H = 72;
  KEY_I = 73;
  KEY_J = 74;
  KEY_K = 75;
  KEY_L = 76;
  KEY_M = 77;
  KEY_N = 78;
  KEY_O = 79;
  KEY_P = 80;
  KEY_Q = 81;
  KEY_R = 82;
  KEY_S = 83;
  KEY_T = 84;
  KEY_U = 85;
  KEY_V = 86;
  KEY_W = 87;
  KEY_X = 88;
  KEY_Y = 89;
  KEY_Z = 90;
  KEY_DIGIT_0 = 100;
  KEY_DIGIT_1 = 101;
  KEY_DIGIT_2 = 102;
  KEY_DIGIT_3 = 103;
  KEY_DIGIT_4 = 104;
  KEY_DIGIT_5 = 105;
  KEY_DIGIT_6 = 106;
  KEY_DIGIT_7 = 107;
  KEY_DIGIT_8 = 108;
  KEY_DIGIT_9 = 109;
}

// A key held with another key. `MODIFIER_META` is Command on macOS, the
// Windows key on Windows and Super on Linux.
enum Modifier {
  MODIFIER_UNSPECIFIED = 0;
  MODIFIER_SHIFT = 1;
  MODIFIER_CONTROL = 2;
  MODIFIER_ALT = 3;
  MODIFIER_META = 4;
}

// Moves the pointer by a distance in logical pixels of the computer's
// screen, after the controller applied its speed and acceleration.
message PointerMove {
  sint32 dx = 1;
  sint32 dy = 2;
}

// Presses (`pressed`) or releases a pointer button. A click is a press and
// a release; a drag is a press, moves, then a release.
message ButtonEvent {
  MouseButton button = 1;
  bool pressed = 2;
}

// Scrolls by a distance in logical pixels. Positive `dy` scrolls toward the
// end of the page (down), positive `dx` to the right.
message Scroll {
  sint32 dx = 1;
  sint32 dy = 2;
}

// Presses (`pressed`) or releases a key, with the modifiers held for it.
message KeyEvent {
  Key key = 1;
  bool pressed = 2;
  repeated Modifier modifiers = 3;
}

// Types text as it is, whatever the computer's keyboard layout.
message TextInput {
  string text = 1;
}

// One input action.
message InputEvent {
  oneof kind {
    PointerMove move = 1;
    ButtonEvent button = 2;
    Scroll scroll = 3;
    KeyEvent key = 4;
    TextInput text = 5;
  }
}

// Input from the controller, in order, without expecting a reply. The
// controller sends at most about 60 a second and merges pointer moves in
// between, so a batch holds what happened since the last one.
message InputBatch {
  repeated InputEvent events = 1;
}

// Asks the computer to lock its screen now, as its own Lock Screen command
// does. Send it only to a computer whose `FeatureSupport` flags for this
// feature include "lock"; older computers don't know it. Expects a
// `LockReply`. The first time per device the computer asks its owner, so
// the reply can take as long as its consent timeout (60 seconds).
message LockRequest {}

// What came of a `LockRequest`.
enum LockResult {
  LOCK_RESULT_UNSPECIFIED = 0;
  // The screen is locked.
  LOCK_RESULT_LOCKED = 1;
  // Its owner said no.
  LOCK_RESULT_DENIED = 2;
  // Nobody answered on the computer in time.
  LOCK_RESULT_TIMEOUT = 3;
  // The computer is asking its owner about another device right now.
  LOCK_RESULT_BUSY = 4;
  // Its owner turned remote input off.
  LOCK_RESULT_TURNED_OFF = 5;
  // The computer tried and couldn't lock.
  LOCK_RESULT_FAILED = 6;
}

message LockReply {
  LockResult result = 1;
}
