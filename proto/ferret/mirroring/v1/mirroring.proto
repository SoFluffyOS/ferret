syntax = "proto3";

package ferret.mirroring.v1;

// Screen mirroring shows one device's screen (the source, an Android phone)
// on another (the viewer, a computer). The viewer asks; the source's owner
// answers the system's own screen capture prompt every time, sees that the
// screen is shared while it lasts, and either side can stop at any moment.
// The same messages carry the source's camera and microphone instead.
//
// Versioning: `StartRequest.version` and `StartAccept.version` carry the
// version of these messages each side speaks, currently 1. A source serves
// any viewer whose version is not newer than its own and answers with its
// own. Fields and enum values added later in the same version are optional:
// a receiver ignores what it doesn't know.
//
// Sound came later in version 1. A viewer asks for it with
// `StartRequest.audio_codecs`; a source that doesn't know the field sends
// pictures only and leaves `StartAccept.audio` unset. A source never sends
// `AudioConfig` or `AudioFrame` to a viewer that didn't ask.
//
// The camera came later in version 1 too. A source that can send its
// camera says so with the `camera` flag in its feature support, and a
// viewer only sets `StartRequest.source` to `SOURCE_CAMERA` for one that
// does: an older source doesn't know the field and would show its screen.
// The camera's owner answers the source's own question (once, always or
// no) instead of the system's screen capture prompt. Everything after
// `StartAccept` is the same stream, with the microphone as its sound.

// How the pictures are encoded.
enum Codec {
  CODEC_UNSPECIFIED = 0;
  // H.264 video. `Frame.data` is one access unit in Annex-B form.
  CODEC_H264 = 1;
  // A JPEG picture per frame, for viewers without a video decoder. Fewer
  // frames per second and a smaller picture.
  CODEC_JPEG = 2;
}

// How the source's sound is encoded.
enum AudioCodec {
  AUDIO_CODEC_UNSPECIFIED = 0;
  // Opus, timed at 48 kHz. `AudioFrame.data` is one Opus packet.
  AUDIO_CODEC_OPUS = 1;
  // Signed 16-bit little-endian samples, channels interleaved, for viewers
  // without an Opus decoder.
  AUDIO_CODEC_PCM_S16LE = 2;
}

// What a source sends.
enum Source {
  // A viewer that doesn't know the field: the screen.
  SOURCE_UNSPECIFIED = 0;
  // Its screen, and what it plays.
  SOURCE_SCREEN = 1;
  // Its camera, and its microphone.
  SOURCE_CAMERA = 2;
}

// One of a source's cameras.
enum CameraLens {
  // Leaves it to the source, which starts with the one on its back.
  CAMERA_LENS_UNSPECIFIED = 0;
  // Faces away from the screen.
  CAMERA_LENS_BACK = 1;
  // Faces whoever looks at the screen.
  CAMERA_LENS_FRONT = 2;
}

// What a viewer wants from the camera. The size and frame rate come from
// `StartRequest.max_width`, `max_height` and `max_fps` like a screen's; a
// source left to itself sends 1280 by 720 at 30 frames per second.
message CameraOptions {
  // The camera to start with. A source that doesn't have it uses another.
  CameraLens lens = 1;
}

// Asks the source to show its screen, or its camera. Expects a
// `StartPending` or `StartDeny` reply. After `StartPending`, the source sends `StartAccept`
// or `StartDeny` later, without expecting a reply.
message StartRequest {
  // The version of these messages the viewer speaks.
  uint32 version = 1;
  // What the viewer can decode, best first.
  repeated Codec codecs = 2;
  // The largest picture the viewer wants, in pixels. 0 leaves it to the
  // source, which never sends more than 1920 on the long side.
  uint32 max_width = 3;
  uint32 max_height = 4;
  // 0 leaves it to the source.
  uint32 max_fps = 5;
  // What the viewer can play of the source's sound, best first. Empty asks
  // for pictures only.
  repeated AudioCodec audio_codecs = 6;
  // What to send. Only set to `SOURCE_CAMERA` for a source whose feature
  // support has the `camera` flag.
  Source source = 7;
  // With `SOURCE_CAMERA` only.
  CameraOptions camera = 8;
}

// The source is asking its owner. The answer follows as `StartAccept` or
// `StartDeny`.
message StartPending {
  // How long the source waits for its owner before it denies with
  // `DENY_REASON_TIMEOUT`.
  uint32 timeout_seconds = 1;
}

// The owner said yes. A `StreamConfig` and `Frame`s follow until either
// side sends `Stop`.
message StartAccept {
  // The version of these messages the source speaks.
  uint32 version = 1;
  // The codec the source picked from `StartRequest.codecs`.
  Codec codec = 2;
  // Whether sound comes with the pictures, for a viewer that asked.
  AudioAnswer audio = 3;
  // With `AUDIO_ANSWER_SENDING`: the codec the source picked from
  // `StartRequest.audio_codecs`.
  AudioCodec audio_codec = 4;
}

// What a source says to a viewer that asked for sound. With its screen,
// only what plays on the source is ever sent, never its microphone, and
// only while its screen is shown. With its camera, the sound is its
// microphone, and only while the camera is on.
enum AudioAnswer {
  // The source doesn't know about sound (an older build), or wasn't asked.
  AUDIO_ANSWER_UNSPECIFIED = 0;
  // An `AudioConfig` and `AudioFrame`s follow.
  AUDIO_ANSWER_SENDING = 1;
  // The source's owner hasn't turned sending sound on, or didn't allow
  // the microphone to go with the camera.
  AUDIO_ANSWER_OFF = 2;
  // The source can't capture what it plays, or can't encode any of
  // `StartRequest.audio_codecs`.
  AUDIO_ANSWER_UNSUPPORTED = 3;
}

// Why a source said no.
enum DenyReason {
  DENY_REASON_UNSPECIFIED = 0;
  // Its owner said no on the system prompt.
  DENY_REASON_DENIED = 1;
  // Nobody answered on the source in time.
  DENY_REASON_TIMEOUT = 2;
  // It already shares its screen, or is asking its owner, for another
  // device.
  DENY_REASON_BUSY = 3;
  // This device can't capture its screen.
  DENY_REASON_UNSUPPORTED = 4;
  // Its owner turned screen mirroring off.
  DENY_REASON_TURNED_OFF = 5;
  // The viewer speaks a newer version.
  DENY_REASON_VERSION = 6;
  // The source can't encode any of `StartRequest.codecs`.
  DENY_REASON_NO_CODEC = 7;
  // The source couldn't show the question, such as when its app is in the
  // background and may not post notices. For a camera: its owner has to
  // open the app first, to allow the camera or to let it start.
  DENY_REASON_CANNOT_ASK = 8;
  // Capturing or encoding failed to start.
  DENY_REASON_FAILED = 9;
}

message StartDeny {
  DenyReason reason = 1;
}

// How to decode the frames that follow. The source sends it before the
// first frame, and again with a new `config_id` when the picture changes,
// such as when the phone is rotated.
message StreamConfig {
  // Goes up by one with every new config in a mirroring session.
  uint32 config_id = 1;
  Codec codec = 2;
  // Size of the picture in pixels, as it should be shown.
  uint32 width = 3;
  uint32 height = 4;
  // How the source's screen is rotated, in degrees clockwise: 0, 90, 180 or
  // 270. The picture is already upright; this is for information.
  uint32 rotation = 5;
  // The most frames per second the source sends.
  uint32 fps = 6;
  // H.264 only: the sequence and picture parameter sets, each one NAL unit
  // without a start code.
  bytes sps = 7;
  bytes pps = 8;
  // A camera only: how far the viewer turns the picture clockwise to show
  // it upright, in degrees: 0, 90, 180 or 270. `width` and `height` are
  // the picture's before it is turned. A camera sends its pictures as its
  // sensor sees them, and a new config when the phone is turned.
  uint32 turn = 9;
}

// One picture. Sent without expecting a reply.
message Frame {
  // The `StreamConfig` this frame belongs to. A viewer drops frames of a
  // config it hasn't seen.
  uint32 config_id = 1;
  // Goes up by one with every frame the source produced, including those
  // it dropped, so a gap tells the viewer how many were dropped.
  uint64 sequence = 2;
  // When the picture was captured, in microseconds on the source's own
  // clock. Only differences mean something.
  int64 pts_us = 3;
  // The frame decodes on its own. After a gap, a viewer waits for one.
  bool keyframe = 4;
  // H.264: one access unit in Annex-B form. JPEG: the picture.
  bytes data = 5;
}

// How to play the sound that follows. The source sends it before the first
// `AudioFrame`, and again after a viewer came back from a dropped
// connection.
message AudioConfig {
  AudioCodec codec = 1;
  // Samples per second of each channel.
  uint32 sample_rate = 2;
  // 1 or 2. With two, samples are interleaved left then right.
  uint32 channels = 3;
}

// A few milliseconds of what plays on the source. Sent without expecting a
// reply. Apps on the source that don't allow their sound to be captured are
// simply not in it, and nothing is sent while the source is silent.
message AudioFrame {
  // Goes up by one with every frame the source produced, including those it
  // dropped because the connection backed up.
  uint64 sequence = 1;
  // When the sound was captured, in microseconds on the same clock as
  // `Frame.pts_us`, so a viewer can keep sound and picture together.
  int64 pts_us = 2;
  // Opus: one packet. PCM: whole samples for every channel.
  bytes data = 3;
}

// The source's sound stopped, such as when capturing it failed. The
// pictures go on. Sent without expecting a reply.
message AudioEnded {}

// Sent by a source that sends its camera, after `StartAccept` and again
// whenever the camera changes. Expects no reply.
message CameraState {
  // The camera that is on.
  CameraLens lens = 1;
  // Every camera a `CameraSwitch` can pick.
  repeated CameraLens lenses = 2;
}

// The viewer picks another of the source's cameras. The source answers
// with a `CameraState` and a new `StreamConfig`. Ignored unless the
// source's camera is on for this viewer. Expects no reply.
message CameraSwitch {
  CameraLens lens = 1;
}

// The viewer lost its place, such as after a decoding error, and asks for a
// frame that decodes on its own. Sent without expecting a reply.
message KeyframeRequest {}

// Why mirroring ended.
enum StopReason {
  STOP_REASON_UNSPECIFIED = 0;
  // The viewer is done, such as when its mirror page closed, or it gave up
  // waiting for the answer.
  STOP_REASON_VIEWER_DONE = 1;
  // Someone on the source pressed Stop.
  STOP_REASON_STOPPED_ON_SOURCE = 2;
  // The source's system ended the capture, such as when the phone was
  // locked.
  STOP_REASON_SYSTEM_ENDED = 3;
  // The source's owner turned screen mirroring off.
  STOP_REASON_TURNED_OFF = 4;
  // Capturing or encoding stopped working.
  STOP_REASON_FAILED = 5;
  // A frame or request arrived for a mirroring session that isn't running.
  STOP_REASON_NOT_MIRRORING = 6;
}

// Ends mirroring. Either side sends it, without expecting a reply. The
// source stops capturing at once.
message Stop {
  StopReason reason = 1;
}

// Something about the source's screen changed while it is shared.
message SourceState {
  // The screen is off: no new frames until it is on again.
  bool screen_off = 1;
}

// How the stream is doing. The viewer sends one about every second; the
// source answers each with its own, and uses them to pick the bitrate.
message Stats {
  // When this was sent, in milliseconds on the sender's own clock.
  int64 sent_at_ms = 1;
  // Source only: `sent_at_ms` of the viewer's `Stats` this answers, so the
  // viewer can measure the round trip.
  int64 echo_sent_at_ms = 2;
  // Viewer: frames shown in the last second. Source: frames sent.
  uint32 fps = 3;
  // Frames dropped in the last second: by the source because the
  // connection backed up, or by the viewer because decoding fell behind.
  uint32 dropped_frames = 4;
  // Source only: what the encoder aims for right now, in kilobits per
  // second. 0 for JPEG.
  uint32 bitrate_kbps = 5;
}
