syntax = "proto3";

package ferret.v1;

import "ferret/v1/device.proto";

// First envelope each side sends on a trusted session (feature "session").
message Hello {
  DeviceInfo device = 1;
  repeated FeatureSupport features = 2;
  // TCP port this device accepts connections on, for reconnecting later.
  uint32 listen_port = 3;
  // This device's addresses on the user's own VPN (Tailscale, ZeroTier,
  // WireGuard), such as "100.101.102.103". Sent only to a device that asked
  // for them (see wants_vpn_addresses and VpnReach); empty otherwise, and
  // from devices that predate VPN reach. An empty list never clears what
  // the receiver remembers: VpnReach does that.
  repeated string vpn_addresses = 4;
  // The user turned on "Also reach this device over my VPN" here, so the
  // receiver may share its VPN addresses with this device.
  bool wants_vpn_addresses = 5;
}

// VPN reach changed during a session (feature "session"): the sender's
// switch for the receiver, and the sender's VPN addresses when the
// receiver asked for them. Devices that predate it ignore it.
message VpnReach {
  // Same as Hello.wants_vpn_addresses.
  bool wants_addresses = 1;
  // Whether addresses below is the sender's full list. False when the
  // receiver hasn't asked for them, and then addresses is empty.
  bool includes_addresses = 2;
  repeated string addresses = 3;
}

// Keeps a session alive and measures round trips (feature "session").
message Ping {
  uint64 sent_at_ms = 1;
}

message Pong {
  uint64 ping_sent_at_ms = 1;
}

// Says the user is active on this device right now, so others know where to
// show suggestions (feature "session").
message Presence {
  bool user_active = 1;
  bool screen_on = 2;
  // Battery level 0-100, or -1 when unknown or plugged desktop.
  int32 battery_percent = 3;
  bool charging = 4;
  // A computer whose screen is locked or showing another account: this
  // device is connected, but nobody is at it to see what arrives.
  bool away = 5;
}

// Sent before a side closes on purpose, so the other one doesn't reconnect.
message Goodbye {
  GoodbyeReason reason = 1;
}

enum GoodbyeReason {
  GOODBYE_REASON_UNSPECIFIED = 0;
  GOODBYE_REASON_SHUTDOWN = 1;
  GOODBYE_REASON_UNPAIRED = 2;
  GOODBYE_REASON_DUPLICATE = 3;
}
