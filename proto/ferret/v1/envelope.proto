syntax = "proto3";

package ferret.v1;

// Every message on a session is an envelope. Features own their payload types,
// so new features never change this file.
message Envelope {
  // Sender-chosen, unique per session, never 0.
  uint64 id = 1;
  // The id of the request this answers, or 0.
  uint64 reply_to = 2;
  // Feature id, such as "session", "handoff" or "drop".
  string feature = 3;
  // Full protobuf name of the payload, such as "ferret.handoff.v1.Activity".
  string type = 4;
  bytes payload = 5;
  // Set on a reply that failed instead of a payload.
  Error error = 6;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_UNSUPPORTED = 1;
  ERROR_CODE_DENIED = 2;
  ERROR_CODE_INVALID = 3;
  ERROR_CODE_INTERNAL = 4;
  ERROR_CODE_TIMEOUT = 5;
  ERROR_CODE_CANCELLED = 6;
}
